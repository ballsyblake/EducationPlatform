# Render blueprint — free tier.
#
# One service, two products: Coach Education at /dashboard and the Club
# Development & Assessment portal at /cda. They share this deployment, the
# database and the account system, so there is nothing extra to configure for
# the CDA portal — no new environment variables, and the rubric catalogue seeds
# itself on boot.
#
# In the Render dashboard: New → Blueprint, point it at this repo, and fill in
# the env vars marked `sync: false` when prompted.
#
# There's no disk here on purpose. Render's free tier has an ephemeral
# filesystem, so all state lives in a hosted Turso database instead — including
# uploaded files, which are stored as rows. See the deployment notes in README.
#
# Free instances sleep after 15 minutes idle; the next request takes 30-60s to
# wake them. Everything else behaves normally.
services:
  - type: web
    # Render matches services by name, so this stays `coach-lms` even though the
    # app now serves both products. Renaming it here would orphan the running
    # service and stand up a new one at a different URL.
    name: coach-lms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Comma-separated addresses granted admin access on boot. On the first
      # deploy a sign-in link for each is printed to the logs.
      #
      # These accounts are admins of both products, and the CDA portal has no
      # other way in on a fresh deploy: club and assessor accounts are created
      # from /cda/cdu, which only an admin can reach.
      - key: ADMIN_EMAILS
        sync: false

      # Turso connection. Create with:
      #   turso db create coach-lms
      #   turso db show coach-lms --url
      #   turso db tokens create coach-lms
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Uploads are stored as database rows, so keep this modest. Film belongs
      # in a video link, not an upload.
      - key: MAX_UPLOAD_MB
        value: "10"

      # Set to "1" to load Football Queensland's 2026 season on the next boot:
      # 48 clubs, three pools, 243 allocations, 2,948 assessor scores, 1,360
      # agreed scores and 52 ambassador portfolios, from the workbooks FQ
      # supplied.
      #
      # Here because the free plan has no shell, so there is no other way to run
      # a one-off script against the database. Add it, save (which redeploys),
      # watch the logs for "FQ 2026 season imported", then remove it.
      #
      # Safe to leave set by accident: the import records that it ran and skips
      # itself on every boot afterwards. It locks and publishes nothing.
      - key: FQ_IMPORT_2026
        sync: false

# Deliberately not listed here, so Render only prompts for what's required:
#
#   APP_URL   Only needed for a custom domain. Otherwise the app falls back to
#             RENDER_EXTERNAL_URL, which Render sets to the real public URL —
#             so sign-in links work on the very first deploy.
#   SMTP_*    Only needed if coaches should request their own sign-in links by
#             email. Without it you hand links out from the staff page.
#
# Both can be added later under the service's Environment tab.
