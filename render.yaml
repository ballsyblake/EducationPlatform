# Render blueprint. In the Render dashboard: New → Blueprint, point it at this
# repo, and set the env vars marked `sync: false` when prompted.
#
# Note: persistent disks require a paid instance type. On Render's free tier the
# filesystem is wiped on every deploy, which would drop the database and every
# uploaded file — so `starter` is the smallest plan that actually works here.
services:
  - type: web
    name: coach-lms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true

    disk:
      name: coach-lms-data
      mountPath: /data
      sizeGB: 5

    envVars:
      # Base URL of the deployed site. Every magic link is built from this, so
      # an incorrect value produces links that point somewhere else.
      - key: APP_URL
        sync: false

      # Comma-separated addresses granted admin access on boot. Whoever is
      # listed here can always sign in, so keep at least one valid address.
      - key: ADMIN_EMAILS
        sync: false

      # SMTP. Leave unset to run in dev mail mode, where sign-in links are
      # written to the logs instead of emailed — fine for a first look, not for
      # real use.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # Where the SQLite file and uploads live on the mounted disk. The
      # entrypoint derives these from DATA_DIR, so they rarely need changing.
      - key: DATA_DIR
        value: /data
